        <h2>Student Login</h2>
        <form action="login.php" method="POST">
            <div class="field email">
                <div class="input-area">
                <input type="email" placeholder="Email Address" name="email" class="input-form" required>
                    <i class="icon fas fa-envelope"></i>
                </div>
            </div>

            <div class="field password">
                <div class="pass-link"><a href="#" onclick="showPopup()">Forgot Password</a></div>
                <div class="input-area">
                    
                <input type="date" id="passF" placeholder="date" name="password" class="input-form" required>
                    <i class="icon fas fa-lock"></i>

                </div>
                
            </div>
            <input type="submit" value="Login"> <br><br>
           </form>
        
    <p id="resetMessage"></p>
</div>


    </div>

<script>

// No password regex for DOB
const form = document.querySelector("form");
const emailField = document.querySelector("input[name='email']");

// SUBMIT VALIDATION
form.onsubmit = (e) => {
    if (!isValidEmail(emailField.value)) {
        alert("Enter a valid email");
        e.preventDefault();
    }
};

// Simple email validation
function isValidEmail(email) {
    return /^[^ ]+@[^ ]+\.[a-z]{2,3}$/.test(email);
}

</script>
