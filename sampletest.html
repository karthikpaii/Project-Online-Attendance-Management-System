<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Batch</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #e8f0f2;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 80%;
        margin: 50px auto;
        background:#e8f0f2;
       
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .form-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap; /* responsive */
        margin-bottom: 15px;
    }

    .form-group {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
    }

    label {
        margin-bottom: 5px;
        font-weight: bold;
    }

    input, select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .btn {
        display: block;
        width: 150px;
        margin: 20px auto 0;
        padding: 10px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .btn:hover {
        background: #0056b3;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Add Batch</h2>

    <form method="POST" action="add_batch.php">

        <div class="form-row">
            <div class="form-group">
                <label>Batch Name</label>
                <input type="text" name="batch_name" required>
            </div>

            <div class="form-group">
                <label>Class/Course</label>
               <input type="text" name="classes" placeholder="e.g. BCA, BCOM" required>
            </div>


             <div class="form-group">
                <label>year</label>
                   <input type="text" name="year" placeholder="e.g. 2026-2027" required>
            </div>
        </div>
        <button type="submit" class="btn">Add Batch</button>

    </form>
</div>

</body>
</html>
